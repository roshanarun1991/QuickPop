name: QuickPop - test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickpop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local Cloudflare runtime
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 --local > /tmp/quickpop-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/quickpop-server.log
          exit 1
      - run: node integration-tests.mjs
      - run: npm run test:browser
      - run: node resilience-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickpop-qa
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: quickpop-site
          path: dist/
  deploy:
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
