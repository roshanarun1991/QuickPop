<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F3EAD5">
  <meta name="description" content="Turn your coffee break into a game show. Free pop culture quizzes, live rooms and a daily challenge. No accounts. Just good company.">
  <title>QuickPop — Big quiz energy.</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script src="./theme.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="#home" aria-label="QuickPop home">QUICK<span>POP</span><i aria-hidden="true">✳</i></a>
    <div class="header-note mono">GOOD COMPANY.<br>QUESTIONABLE CONFIDENCE.</div>
    <nav aria-label="Main navigation">
      <button class="btn small paper" id="sound" aria-label="Turn sound on" aria-pressed="false">♫ <span>Sound off</span></button>
      <button class="btn square paper" id="theme" aria-label="Switch colour theme">☾</button>
      <a class="btn cyan" href="#join">JOIN A QUIZ <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer><a class="wordmark mini" href="#home">QUICKPOP✳</a><span>MADE FOR THE PEOPLE AROUND YOU.</span><button class="text-button" id="privacy">Privacy & how it works</button></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div><button class="btn paper modal-close" id="modal-close">Close</button></dialog>
  <noscript><p class="noscript">QuickPop needs JavaScript to run the game. Enable JavaScript and reload.</p></noscript>
</body>
</html>
