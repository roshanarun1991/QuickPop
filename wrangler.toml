name = "quickpop"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "ad24429455fe95738133b4c8302b4a6a"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "QuizRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizRoom", "RoomDirectory"]

[observability]
enabled = false
